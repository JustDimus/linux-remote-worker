# Unit tests on every push to a branch and every pull request; the release workflow runs the same job first.
#
# Linux runs the script tests with /bin/bash; Windows runs them with Git Bash (LRW_BASH) and also covers
# what only exists there, such as passwords saved with DPAPI. Nothing here connects to a server.

name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, bash: '' }
          - { os: windows-latest, bash: 'C:\Program Files\Git\bin\bash.exe' }
    runs-on: ${{ matrix.os }}
    env:
      LRW_BASH: ${{ matrix.bash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test LinuxRemoteWorker.Tests/LinuxRemoteWorker.Tests.csproj -c Release --logger "console;verbosity=normal"
