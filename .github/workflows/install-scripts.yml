# Installs lrw and the Claude Code skill with scripts/install-cli.sh (Ubuntu, macOS) and scripts/install-cli.ps1
# (Windows: PowerShell 7 from the file, Windows PowerShell 5.1 the way the one-liner runs it), runs lrw, checks the
# status, runs the script again (nothing to download) and uninstalls. Each job installs into throwaway folders;
# Claude Code itself is not there, so the MCP registration is only reported.
#
# On a push of the scripts or the skill, or by hand, it installs the newest release. release.yml calls it with the
# tag of the release it has just published as a pre-release: then that release is installed, and lrw update is tried
# on it too - --check, a plain run (nothing to do) and --force with that version (the release's own script
# downloaded, checked and run over the running program). Only when this passes does the release become the latest.

name: Install scripts

on:
  push:
    paths:
      - scripts/**
      - skill/**
      - .github/workflows/install-scripts.yml
  workflow_call:
    inputs:
      version:
        description: Release tag to install and to try lrw update on (a release just published as a pre-release)
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: install-cli.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install, run, update, uninstall
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home" SHELL=/bin/bash
          mkdir -p "$HOME/.claude"   # as if Claude Code were installed, so the skill is added
          pick=""
          if [ -n "$VERSION" ]; then pick="--version $VERSION"; fi
          bash scripts/install-cli.sh $pick
          lrw="$HOME/.local/bin/lrw"
          "$lrw" version --text
          "$lrw" help >/dev/null
          grep -qsF '.local/bin' "$HOME/.bashrc" "$HOME/.bash_profile"
          grep -q '^name: linux-remote-worker' "$HOME/.claude/skills/linux-remote-worker/SKILL.md"
          bash scripts/install-cli.sh --status | tee status.txt
          if [ -n "$VERSION" ]; then
            # Still a pre-release, so it is newer than the latest release
            test "v$("$lrw" version --text)" = "$VERSION"
            grep -Eq 'up to date|newer than the newest release' status.txt
            "$lrw" update --check --json | tee check.json
            grep -q '"updateAvailable": false' check.json
            "$lrw" update --json | tee update.json
            grep -q '"updated": false' update.json
            "$lrw" update --force --version "$VERSION" --no-mcp --json | tee forced.json
            grep -q '"updated": true' forced.json
            test "v$("$lrw" version --text)" = "$VERSION"
          else
            grep -q 'up to date' status.txt
          fi
          bash -s -- --no-mcp $pick < scripts/install-cli.sh | tee second-run.txt
          grep -q 'already installed' second-run.txt
          bash scripts/install-cli.sh --uninstall
          test ! -e "$HOME/.local/bin/lrw"
          test ! -e "$HOME/.local/share/lrw"
          test ! -e "$HOME/.claude/skills/linux-remote-worker"

  windows:
    name: install-cli.ps1 (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: PowerShell 7, from the file
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'pwsh'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'claude-pwsh'   # as if Claude Code were installed
          New-Item -ItemType Directory -Force $env:CLAUDE_CONFIG_DIR | Out-Null
          $skill = "$env:CLAUDE_CONFIG_DIR\skills\linux-remote-worker"
          $pick = @{}
          if ($env:VERSION) { $pick.Version = $env:VERSION }
          ./scripts/install-cli.ps1 @pick
          $lrw = "$env:LOCALAPPDATA\Programs\lrw\lrw.exe"
          & $lrw version --text
          if ($LASTEXITCODE -ne 0) { throw 'lrw does not start' }
          if (-not (Test-Path "$skill\SKILL.md")) { throw 'the skill was not added' }
          $status = ./scripts/install-cli.ps1 -Status 6>&1 | Out-String
          $status
          if ($env:VERSION) {
            # Still a pre-release, so it is newer than the latest release
            if ("v$(& $lrw version --text)" -ne $env:VERSION) { throw "lrw is not $env:VERSION" }
            if ($status -notmatch 'up to date|newer than the newest release') { throw 'status does not know the installed version' }
            $check = & $lrw update --check --json | Out-String; $check
            if ($check -notmatch '"updateAvailable": false') { throw 'lrw update --check does not report up to date' }
            $plain = & $lrw update --json | Out-String; $plain
            if ($plain -notmatch '"updated": false') { throw 'lrw update did something although lrw is up to date' }
            # Run from this PowerShell 7: lrw must start Windows PowerShell without PowerShell 7's module path. The script
            # renames the running lrw.exe out of the way and puts the release's copy in its place.
            $forced = & $lrw update --force --version $env:VERSION --no-mcp --json | Out-String; $forced
            if ($LASTEXITCODE -ne 0 -or $forced -notmatch '"updated": true') { throw 'lrw update --force failed' }
            if ("v$(& $lrw version --text)" -ne $env:VERSION) { throw "lrw is not $env:VERSION after the update" }
          }
          elseif ($status -notmatch 'up to date') { throw 'status does not report the installed version as up to date' }
          ./scripts/install-cli.ps1 @pick -NoMcp
          ./scripts/install-cli.ps1 -Uninstall
          if (Test-Path "$env:LOCALAPPDATA\Programs\lrw") { throw 'lrw is still there after uninstall' }
          if (Test-Path $skill) { throw 'the skill is still there after uninstall' }

      - name: Windows PowerShell 5.1, as the one-liner runs it
        shell: powershell
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'winps'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'claude-winps'
          New-Item -ItemType Directory -Force $env:CLAUDE_CONFIG_DIR | Out-Null
          $skill = "$env:CLAUDE_CONFIG_DIR\skills\linux-remote-worker"
          $pick = @{}
          if ($env:VERSION) { $pick.Version = $env:VERSION }
          & ([scriptblock]::Create((Get-Content -Raw scripts/install-cli.ps1))) @pick -NoMcp
          & "$env:LOCALAPPDATA\Programs\lrw\lrw.exe" version --text
          if ($LASTEXITCODE -ne 0) { throw 'lrw does not start' }
          if (-not (Test-Path "$skill\SKILL.md")) { throw 'the skill was not added' }
          & ([scriptblock]::Create((Get-Content -Raw scripts/install-cli.ps1))) -Uninstall
          if (Test-Path "$env:LOCALAPPDATA\Programs\lrw") { throw 'lrw is still there after uninstall' }
          if (Test-Path $skill) { throw 'the skill is still there after uninstall' }
